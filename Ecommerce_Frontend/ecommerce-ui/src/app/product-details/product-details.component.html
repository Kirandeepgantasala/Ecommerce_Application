<div class="container d-flex flex-column p-2" *ngIf="product">
    <div class="mt-3 p-2 d-flex justify-content-center align-items-center" style="height:350px;">
        <img [src]="product.imageUrl" alt="{{product.name}}" style="width:350px; object-fit:contain; aspect-ratio:1/1;" class="img-fluid">
    </div>

    <div class="mt-2">
        <p class="fs-1 fw-bold"> {{product.name}}</p>
       <p class="fs-3 fw-bold">Price: {{product.price}}</p>
       <div class="description mt-4 fs-5">
        Description
        <hr class="border-top border-primary">

        <p> {{product.description}}</p>
       </div>
       <button class="btn btn-primary" (click)="addToCart(product)">Add to Cart</button>
    </div>
</div>
