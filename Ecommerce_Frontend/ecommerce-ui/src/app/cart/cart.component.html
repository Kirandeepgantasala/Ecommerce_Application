<p>Cart</p>
<div class="container d-grid row-gap-3">

    <div class="row">
        <div *ngIf="cartItems.length>0">
        <div class="col col-12 d-flex justify-content-around align-items-center p-2 gap-1" *ngFor="let cartItem of cartItems" style="height:300px;border:2px solid green;">
            <img src="{{cartItem.imageUrl}}" alt="{{cartItem.productName}}" style="width:200px;object-fit:contain;aspect-ratio:1/1;" class="img-fluid">

            <div class="product-details p-2 text-center" style="margin-left:200px;">
                <p style="padding:10px;">{{cartItem.productName}}</p>
                <p style="padding:10px;">Price:{{cartItem.price}}</p>
                <p>Quantity:{{cartItem.quantity}}</p>
            </div>
            <div class="p-1" style="margin-left:200px;">
                <button class="btn btn-danger" (click)="decreaseQuantity(cartItem.productId)">-</button>
                <span style="padding:10px;">{{cartItem.quantity}}</span>
                <button class="btn btn-primary" (click)="increaseQuantity(cartItem.productId)">+</button>
                <button class="btn btn-danger" style="margin-left:10px;" (click)="removeItemFromCart(cartItem.productId)">Remove</button>
            </div>
        </div>
    

    <div class="d-flex justify-content-around p-2" style="margin-top:50px;">
        <div class="fs-5 fw-medium">
            TotalPrice: {{totalPrice}}
        </div>
        <div>
            <button class="btn btn-primary" (click)="proceedToPayment()">Proceed to Payment</button>
        </div>
        
    </div>
    </div>
    </div>
</div>

<div *ngIf="cartItems.length<=0">
<div>
    cart is empty
</div>
</div>
