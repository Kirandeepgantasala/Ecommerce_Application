<div class="container-fluid vh-100 d-flex justify-content-center align-items-center bg-dark">

    <div class="payment-card text-center p-5">

        <div class="mb-4">
            <i class="bi bi-x-octagon-fill failure-icon"></i>
        </div>

        <h1 class="failure-title">
            Payment Failed
        </h1>

        <p class="failure-text">
            Your payment could not be completed.
            Please try again.
        </p>

        <div class="d-grid gap-3 mt-4">

            <button class="btn btn-warning fw-bold py-2"
                    routerLink="/checkout">
                Retry Payment
            </button>

            <button class="btn btn-outline-light py-2"
                    routerLink="/home">
                Continue Shopping
            </button>

        </div>

    </div>

</div>
