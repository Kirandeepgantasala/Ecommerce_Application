<div class="container mt-4">

    <h2 class="fw-bold mb-4">
        My Orders
    </h2>

    <div *ngIf="orders.length===0" class="empty_orders_container">
       
        <p class="no_orders_header"><i class="bi bi-bag-x"></i>No Orders Yet</p>
   <p class="no_orders_subheading">Start shopping to place your first order</p>
    </div>

    <div
        class="card shadow-sm border-0 rounded-4 mb-4"
        *ngFor="let order of orders">

     

        <!-- Order Header -->
        <div
            class="card-header bg-white border-0 d-flex justify-content-between align-items-center py-3 rounded-top-4">

            <div>
                <h6 class="mb-1 fw-bold">
                    Order #{{order.orderId}}
                </h6>

                <small class="text-muted">
                    {{order.createdAt | date:'medium'}}
                </small>
            </div>

            <span
                class="badge px-3 py-2 fs-6"
                [ngClass]="{
                    'bg-success': order.orderStatus === 'CONFIRMED',
                    'bg-warning text-dark': order.orderStatus === 'PENDING',
                    'bg-danger': order.orderStatus === 'CANCELLED'
                }">

                {{order.orderStatus}}

            </span>

        </div>

        <!-- Order Items -->
        <div class="card-body">

            <div
                class="d-flex justify-content-between align-items-center border-bottom py-3"
                *ngFor="let item of order.orderItems">

                <div class="d-flex align-items-center gap-3">

                    <!-- Product Image -->
                    <img
                        *ngIf="item.imageUrl"
                        [src]="item.imageUrl"
                        width="70"
                        height="70"
                        class="rounded-3 border object-fit-cover">

                    <div>

                        <h6 class="mb-1 fw-semibold">
                            {{item.productName}}
                        </h6>

                        <small class="text-muted">
                            Quantity: {{item.quantity}}
                        </small>

                    </div>

                </div>

                <div class="fw-bold text-success fs-5">

                    ₹{{item.price}}

                </div>

            </div>

            <!-- Order Footer -->
            <div
                class="d-flex justify-content-between align-items-center pt-3">

                <h6 class="mb-0">
                    Total Items:
                    <span class="fw-bold">
                        {{order.totalQuantity}}
                    </span>
                </h6>

                <h5 class="mb-0 text-primary fw-bold">

                    ₹{{order.totalPrice}}

                </h5>

            </div>

        </div>

    </div>

</div>
